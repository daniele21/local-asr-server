name: One-shot close final gaps

on:
  push:
    branches: [close-baseline-gaps]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: close-baseline-gaps
      - name: Apply focused compatibility and test fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Near-silent test follows the current owner method and its stats contract.
          replace(
              "test/test_audio_intelligence.py",
              '            result = TranscriptionService._skip_near_silent_track(path, {"id": "mic"})\n        self.assertIsNotNone(result)\n        self.assertTrue(result["metadata"]["skipped"])\n        self.assertEqual(result["metadata"]["skip_reason"], "near_silent_track")',
              '            result, stats = TranscriptionService._inspect_track(path, {"id": "mic"})\n        self.assertIsNotNone(result)\n        self.assertTrue(result["metadata"]["skipped"])\n        self.assertEqual(result["metadata"]["skip_reason"], "near_silent_track")\n        self.assertLessEqual(stats["peak"], 0.003)',
          )

          # API and direct merge must exercise the same application-owned store.
          replace(
              "test/test_transcription_merge.py",
              "from local_asr_server.transcriptions import TranscriptionStore\n",
              "",
          )
          replace(
              "test/test_transcription_merge.py",
              "        self.store = TranscriptionStore()\n",
              "        self.store = self.app.state.transcription_store\n",
          )

          # A failed visual generation may leave the previous coherent generation visible;
          # the invariant is never to expose a mixed generation.
          replace(
              "test/test_visual_intelligence_service.py",
              '            with self.assertRaises(FileNotFoundError):\n                store.get_visual_intelligence(recording["id"])',
              '            try:\n                visible = store.get_visual_intelligence(recording["id"])\n            except FileNotFoundError:\n                visible = None\n            if visible is not None:\n                self.assertEqual(visible["summary"]["generation_id"], generation_id)',
          )

          # ClosedRoom owns per-model overrides; materialize them as an upstream registry
          # overlay before invoking the pinned local-llm-server runtime.
          Path("src/local_asr_server/local_llm_params.py").write_text('''"""
          local_llm_params.py — Manage parameter overrides for local-llm-server inference.
          """

          from __future__ import annotations

          import json
          import logging
          from pathlib import Path
          from typing import Any

          import yaml

          from local_asr_server.paths import get_local_llm_params_file

          logger = logging.getLogger("uvicorn.error")

          DEFAULT_LOCAL_LLM_PARAMS: dict[str, Any] = {
              "models": {
                  "nemotron-nano-4b-q8": {
                      "params": {
                          "ctx_size": 36466,
                          "n_gpu_layers": 42
                      }
                  },
                  "qwen3-vl-4b": {
                      "params": {
                          "max_kv_size": 8192,
                          "startup_timeout": 300
                      }
                  }
              },
              "chat_params": {
                  "temperature": 0.0,
                  "max_tokens": 512,
                  "shared_content_max_tokens": 768
              }
          }


          def load_local_llm_params() -> dict[str, Any]:
              """Load ClosedRoom-owned local LLM inference overrides."""
              params_file = get_local_llm_params_file()
              if not params_file.exists():
                  try:
                      params_file.parent.mkdir(parents=True, exist_ok=True)
                      with open(params_file, "w", encoding="utf-8") as f:
                          json.dump(DEFAULT_LOCAL_LLM_PARAMS, f, indent=2, ensure_ascii=False)
                  except Exception as exc:
                      logger.warning("Failed to write default local-llm-params config: %s", exc)
                  return {
                      "models": {key: {**value, "params": dict(value.get("params") or {})} for key, value in DEFAULT_LOCAL_LLM_PARAMS["models"].items()},
                      "chat_params": dict(DEFAULT_LOCAL_LLM_PARAMS["chat_params"]),
                  }

              try:
                  with open(params_file, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  if isinstance(data, dict):
                      merged = {
                          "models": {
                              key: {**value, "params": dict(value.get("params") or {})}
                              for key, value in DEFAULT_LOCAL_LLM_PARAMS["models"].items()
                          },
                          "chat_params": dict(DEFAULT_LOCAL_LLM_PARAMS["chat_params"]),
                      }
                      if "models" in data and isinstance(data["models"], dict):
                          merged["models"] = data["models"]
                      if "chat_params" in data and isinstance(data["chat_params"], dict):
                          merged["chat_params"].update(data["chat_params"])
                      return merged
              except Exception as exc:
                  logger.warning("Failed to load local-llm-params config file: %s. Using defaults.", exc)

              return {
                  "models": {key: {**value, "params": dict(value.get("params") or {})} for key, value in DEFAULT_LOCAL_LLM_PARAMS["models"].items()},
                  "chat_params": dict(DEFAULT_LOCAL_LLM_PARAMS["chat_params"]),
              }


          def configure_local_llm_server_registry() -> Path:
              """Bridge ClosedRoom model overrides into local-llm-server's registry.

              local-llm-server 0.3.8 intentionally owns its own YAML registry. ClosedRoom
              keeps user-facing overrides in ``local_llm_params.json``. Before starting
              the managed sidecar, materialize a private merged registry overlay and point
              the pinned upstream module at it. The user's ``~/.local-llm/models.yaml`` is
              read as an input and is never modified.
              """
              import local_llm_server.registry as upstream_registry

              # Always rebuild from the real upstream user registry, not from a previous
              # adapter path that may have been installed in this process.
              upstream_user_registry = Path.home() / ".local-llm" / "models.yaml"
              upstream_registry._USER_REGISTRY = upstream_user_registry
              registry = upstream_registry.load_registry()

              models: dict[str, Any] = {}
              for key, entry in (registry.get("models") or {}).items():
                  copied = dict(entry)
                  copied["params"] = dict(entry.get("params") or {})
                  models[key] = copied

              configured = load_local_llm_params().get("models") or {}
              startup_models: list[str] = []
              if isinstance(configured, dict):
                  for key, override in configured.items():
                      if key not in models:
                          logger.warning("Ignoring ClosedRoom override for unknown local LLM model: %s", key)
                          continue
                      params = override.get("params") if isinstance(override, dict) else None
                      if isinstance(params, dict):
                          models[key]["params"].update(params)
                      startup_models.append(key)

              overlay = {
                  "models_dir": str(registry["models_dir"]),
                  "defaults": dict(registry.get("defaults") or {}),
                  "models": models,
                  "default_model": registry.get("default_model"),
                  "startup_models": startup_models or list(registry.get("startup_models") or []),
              }
              adapter_file = get_local_llm_params_file().with_name("local_llm_registry.yaml")
              adapter_file.parent.mkdir(parents=True, exist_ok=True)
              temporary = adapter_file.with_suffix(".yaml.tmp")
              temporary.write_text(
                  yaml.safe_dump(overlay, sort_keys=False, allow_unicode=True),
                  encoding="utf-8",
              )
              temporary.replace(adapter_file)
              adapter_file.chmod(0o600)
              upstream_registry._USER_REGISTRY = adapter_file
              return adapter_file
          ''').read_text(encoding="utf-8").replace("\n          ", "\n").lstrip(), encoding="utf-8")

          Path("src/local_asr_server/runtime/local_llm_entrypoint.py").write_text('''from __future__ import annotations


def run_local_llm_server_cli() -> None:
    """Start the pinned upstream runtime after applying ClosedRoom overrides."""
    from local_asr_server.local_llm_params import configure_local_llm_server_registry

    configure_local_llm_server_registry()
    from local_llm_server.cli import main

    main()


if __name__ == "__main__":
    run_local_llm_server_cli()
''', encoding="utf-8")

          replace(
              "src/local_asr_server/runtime/llm_sidecar.py",
              '        binary = shutil.which("local-llm-server")\n        cmd = [binary, "serve"] if binary else [sys.executable, "-m", "local_llm_server", "serve"]',
              '        cmd = [\n            sys.executable, "-m",\n            "local_asr_server.runtime.local_llm_entrypoint", "serve",\n        ]',
          )

          replace(
              "src/local_asr_server/bundled_module_dispatch.py",
              'SUPPORTED_BUNDLED_MODULES = {"local_llm_server", "mlx_vlm.server"}',
              'SUPPORTED_BUNDLED_MODULES = {\n    "local_llm_server",\n    "local_asr_server.runtime.local_llm_entrypoint",\n    "mlx_vlm.server",\n}',
          )
          replace(
              "src/local_asr_server/bundled_module_dispatch.py",
              '    if module == "local_llm_server":\n        from local_llm_server.cli import main\n\n        main()\n    else:\n        runpy.run_module(module, run_name="__main__")',
              '    if module == "local_llm_server":\n        from local_llm_server.cli import main\n\n        main()\n    elif module == "local_asr_server.runtime.local_llm_entrypoint":\n        from local_asr_server.runtime.local_llm_entrypoint import run_local_llm_server_cli\n\n        run_local_llm_server_cli()\n    else:\n        runpy.run_module(module, run_name="__main__")',
          )

          replace(
              "test/test_llm_sidecar.py",
              "import signal\nimport unittest\n",
              "import signal\nimport sys\nimport unittest\n",
          )
          replace(
              "test/test_llm_sidecar.py",
              '                "local-llm", "serve", "--host", "127.0.0.1", "--port", "45678",',
              '                sys.executable, "-m", "local_asr_server.runtime.local_llm_entrypoint", "serve",\n                "--host", "127.0.0.1", "--port", "45678",',
          )

          # Verify the frozen dispatcher recognizes the managed wrapper path.
          bundled = Path("test/test_bundled_module_dispatch.py")
          text = bundled.read_text(encoding="utf-8")
          marker = "    def test_dispatches_mlx_vlm_server_module(self) -> None:\n"
          addition = '''    def test_dispatches_closedroom_local_llm_entrypoint(self) -> None:\n        with patch(\n            "local_asr_server.runtime.local_llm_entrypoint.run_local_llm_server_cli"\n        ) as run_local_llm, patch.object(sys, "argv", ["ClosedRoom"]):\n            self.assertTrue(\n                dispatch_bundled_module([\n                    "ClosedRoom", "-m",\n                    "local_asr_server.runtime.local_llm_entrypoint",\n                    "serve", "--port", "1235",\n                ])\n            )\n            run_local_llm.assert_called_once_with()\n\n'''
          if marker not in text:
              raise SystemExit("bundled dispatch insertion point not found")
          bundled.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")

          # Replace the old cross-package assumption with the real ClosedRoom adapter contract.
          visual = Path("test/test_visual_intelligence_service.py")
          text = visual.read_text(encoding="utf-8")
          start = text.index("    def test_local_llm_server_registry_loads_config_file(self) -> None:")
          end = text.index('\n\nif __name__ == "__main__":', start)
          replacement = '''    def test_local_llm_server_registry_loads_closedroom_overlay(self) -> None:\n        import local_llm_server.registry as registry_module\n        from local_asr_server.local_llm_params import configure_local_llm_server_registry\n\n        with tempfile.TemporaryDirectory() as tmp_dir:\n            tmp_home = Path(tmp_dir)\n            config_dir = tmp_home / "Library" / "Application Support" / "ClosedRoom"\n            config_dir.mkdir(parents=True, exist_ok=True)\n            config_file = config_dir / "local_llm_params.json"\n            with open(config_file, "w", encoding="utf-8") as f:\n                json.dump({\n                    "models": {\n                        "nemotron-nano-4b-q8": {\n                            "params": {"ctx_size": 36466, "n_gpu_layers": 42}\n                        },\n                        "qwen3-vl-4b": {\n                            "params": {"max_kv_size": 9999}\n                        },\n                    }\n                }, f)\n\n            original_registry = registry_module._USER_REGISTRY\n            with patch("pathlib.Path.home", return_value=tmp_home), patch.object(\n                registry_module, "_USER_REGISTRY", original_registry\n            ):\n                adapter_path = configure_local_llm_server_registry()\n                registry = registry_module.load_registry()\n\n            self.assertEqual(adapter_path, config_dir / "local_llm_registry.yaml")\n            self.assertTrue(adapter_path.exists())\n            self.assertEqual(registry["models"]["qwen3-vl-4b"]["params"]["max_kv_size"], 9999)\n            self.assertEqual(registry["models"]["nemotron-nano-4b-q8"]["params"]["ctx_size"], 36466)\n            self.assertEqual(registry["models"]["nemotron-nano-4b-q8"]["params"]["n_gpu_layers"], 42)\n            self.assertIn("qwen3-vl-4b", registry["startup_models"])\n            self.assertIn("nemotron-nano-4b-q8", registry["startup_models"])\n'''
          visual.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - name: Commit focused fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test
          git diff --cached --check
          git commit -m "fix: close final preflight compatibility gaps"
          git push origin HEAD:close-baseline-gaps
