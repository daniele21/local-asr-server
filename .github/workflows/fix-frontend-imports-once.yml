name: Fix frontend duplicate imports once

on:
  push:
    branches: [close-baseline-gaps]
    paths:
      - .github/workflows/fix-frontend-imports-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: close-baseline-gaps
          fetch-depth: 0
      - name: Merge duplicate imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('frontend/src/components/workspace/MeetingWorkspace.tsx'): (
                  "  UserRound,\n} from 'lucide-react';\nimport type { LucideIcon } from 'lucide-react';",
                  "  UserRound,\n  type LucideIcon,\n} from 'lucide-react';",
              ),
              Path('frontend/src/pages/ProjectsPage.tsx'): (
                  "import { InsightDetailDialog } from '../components/workspace/InsightDetailDialog';\nimport type { InsightTab } from '../components/workspace/InsightDetailDialog';",
                  "import { InsightDetailDialog, type InsightTab } from '../components/workspace/InsightDetailDialog';",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit focused fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/workspace/MeetingWorkspace.tsx frontend/src/pages/ProjectsPage.tsx
          git commit -m "frontend: merge duplicate imports"
          git fetch origin close-baseline-gaps
          git rebase origin/close-baseline-gaps
          git push origin HEAD:close-baseline-gaps
