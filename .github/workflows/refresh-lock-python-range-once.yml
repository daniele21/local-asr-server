name: Refresh uv lock Python range once

on:
  push:
    branches: [close-baseline-gaps]
    paths:
      - .github/workflows/refresh-lock-python-range-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: close-baseline-gaps
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Refresh lock
        run: uv lock --python 3.12
      - name: Commit lock only when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh lock for supported Python range"
          git fetch origin close-baseline-gaps
          git rebase origin/close-baseline-gaps
          git push origin HEAD:close-baseline-gaps
