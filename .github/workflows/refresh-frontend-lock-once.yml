name: Refresh frontend lock once

on:
  push:
    branches: [close-baseline-gaps]
    paths:
      - .github/workflows/refresh-frontend-lock-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: close-baseline-gaps
          fetch-depth: 0
      - name: Install pnpm
        run: npm install --global pnpm@9.15.9
      - name: Refresh frontend lock
        run: cd frontend && pnpm install --lockfile-only
      - name: Commit lock only when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/pnpm-lock.yaml; then
            echo "frontend lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/pnpm-lock.yaml
          git commit -m "chore: refresh frontend lint lock"
          git fetch origin close-baseline-gaps
          git rebase origin/close-baseline-gaps
          git push origin HEAD:close-baseline-gaps
